repos:
# Bug & hygiene ruleset (see .ruff.toml): syntax errors (E9), undefined names (F821),
# redefinitions (F811), unused imports (F401), and unused variables (F841).
# Pinned cycle snapshots and notebook cells are exempted in .ruff.toml.
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.7   # the version .ruff.toml was validated against
  hooks:
  - id: ruff-check   # `ruff` is a legacy alias at this rev
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 3.0.0
  hooks:
  - id: shellcheck
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
