# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root requirements.txt is the CPU dev/test toolchain only (see its header);
  # the runtime pins live in the per-workspace files listed below.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"           # "daily" is noisy; use "weekly" or "monthly" unless you want daily
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencies:
        patterns:
          - "*"

  # Also check subdirectories that have their own requirements files
  - package-ecosystem: "pip"
    directory: "/openenv-custom-training"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/openenv-multi-catalog-training"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      dependencies:
        patterns:
          - "*"

  # NOTE: no entry for /sakthai-agentic-eval-train or /sakthai-sft-training —
  # neither has a requirements.txt. Their scripts declare dependencies in PEP
  # 723 inline headers, which Dependabot does not parse, so an entry there is
  # silently a no-op rather than an error.
  - package-ecosystem: "pip"
    directory: "/openenv-multi-catalog-training/a2a_agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      dependencies:
        patterns:
          - "*"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
