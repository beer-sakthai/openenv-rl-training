core:
  - "**/*.py"
  - "requirements.txt"
workflows:
  - ".github/workflows/*.yml"
docs:
  - "**/*.md"
# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration.  For more information, see:
# https://github.com/actions/labeler

test:
  - "test_*.py"
  - "*/tests/*"
  - "*/*_test.py"
"enhancement":
  - any:
      - 'src/**/*'
      - 'scripts/**/*'
"bug":
  - any:
      - 'tests/**/*'
# Add 'backend' label to any changes in the backend directory
backend:
  - backend/**/*

# Add 'frontend' label to any changes in the frontend directory
frontend:
  - frontend/**/*

# Add 'docs' label to any changes in the docs directory or markdown files
docs:
  - docs/**/*
  - '**/*.md'

# Add 'tests' label to any changes in test directories
tests:
  - '**/*test*/**/*'
  - '**/*test*.py'

# Add 'ci' label to any changes in github actions
ci:
  - .github/**/*

# Add 'scripts' label to any changes in scripts directories
scripts:
  - '**/*scripts*/**/*'
