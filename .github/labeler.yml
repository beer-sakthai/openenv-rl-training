# actions/labeler@v4 config — auto-label PRs based on which paths they touch.
# Referenced by .github/workflows/label.yml; without this file the labeler
# action fails with 'Not Found' on every PR.

rl-custom:
  - openenv-custom-training/**

rl-catalog:
  - openenv-multi-catalog-training/**

rl-eval:
  - sakthai-agentic-eval-train/**

sft:
  - sakthai-sft-training/**

browsergym:
  - browsergym-space/**
  - openenv-custom-training/train.py

ci:
  - .github/**

docs:
  - "**/*.md"
  - docs/**

skills:
  - .opencode/**
