name: Weekly HF Monitor
on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday 8AM
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install huggingface_hub
      - run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          print('| Model | Downloads | Likes |')
          print('|---|---|---|')
          for m in api.list_models(author='Nanthasit', sort='downloads', direction=-1):
            print(f'| {m.modelId.split(\"/\")[-1]} | {m.downloads} | {m.likes} |')
          "
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: always()
        with:
          script: core.setFailed('Manual check required')
