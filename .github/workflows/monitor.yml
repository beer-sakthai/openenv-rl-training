# Weekly snapshot of the Nanthasit Hub models, written to the run's job summary.
#
# This used to end with `core.setFailed('Manual check required')` guarded by
# `if: always()`, so a scheduled workflow went red every Monday by design. A
# permanently-red badge trains everyone to ignore red badges, which is exactly
# what you do not want on a repo whose other five workflows fail on billing.
# The report is informational, so it is published as a job summary and the run
# passes.
name: Weekly HF Monitor
on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday 8AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub

      - name: Report Hub model stats
        env:
          # Public listing works unauthenticated; the token just raises the
          # rate limit and reveals private repos when it is configured.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ.get("HF_TOKEN") or None)
          print("## Nanthasit Hub models\n")
          print("| Model | Downloads | Likes |")
          print("|---|---:|---:|")
          rows = 0
          # No `direction=` here: huggingface_hub 1.x removed the argument, and the
          # runner installs the latest (1.31.0 as of 2026-09-18), so passing it
          # raised `TypeError: HfApi.list_models() got an unexpected keyword
          # argument 'direction'` and failed the job. `sort="downloads"` already
          # returns descending order.
          for m in api.list_models(author="Nanthasit", sort="downloads"):
              name = m.modelId.split("/")[-1]
              print(f"| {name} | {m.downloads} | {m.likes} |")
              rows += 1
          if not rows:
              print("| _no models returned_ | | |")
          PY
