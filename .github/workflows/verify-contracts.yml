name: Verify GRPO + BrowserGym Contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The only workflow in this repo that runs entirely in GH Actions.
# Everything else dispatches to HF Jobs (needs HF_TOKEN + a paid HF Jobs plan).
#
# The workspace test suites under openenv-custom-training/ and
# sakthai-agentic-eval-train/ used to exist without any job running them; the
# root conftest.py stubs `openenv` so they collect on a CPU runner.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: ruff (syntax errors, undefined names, redefinitions)
        run: uv run --with ruff ruff check --output-format=github .

      - name: verify_grpo_contract.py (CPU, no torch/trl required)
        run: python3 verify_grpo_contract.py

      # One invocation on purpose: the suites share sys.modules, and running
      # them separately hid a mock leak between them (see tests/conftest notes).
      - name: pytest (contract + workspace suites)
        run: |
          uv run --with datasets --with pytest --with pydantic --with httpx \
            pytest test_browsergym_contract.py \
                   sakthai-agentic-eval-train/tests/ \
                   openenv-custom-training/tests/ -v
