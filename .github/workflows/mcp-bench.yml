name: MCP-Bench
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # submission only; the benchmark itself runs on HF.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub

      # Without this the next step fails with `hf: command not found` — this
      # workflow installed no huggingface_hub and never authenticated, unlike
      # eval.yml and lighteval.yml which both do.
      - name: Authenticate Hugging Face CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN repository secret is not configured or is unavailable to this workflow."
            exit 1
          fi
          hf auth login --token "$HF_TOKEN"

      - run: |
          git clone https://github.com/huggingface/mcp-bench.git
          cd mcp-bench/mcp_servers && bash install.sh
      - run: |
          .github/scripts/hf-jobs-submit.sh \
            hf jobs uv run --flavor h200 --timeout 3h \
              -e MCP_BENCH_DIR=./mcp-bench \
              -e HUGGINGFACE_BASE_URL=http://localhost:8000/v1 \
              --secrets HF_TOKEN \
              sakthai-sft-training/eval-mcp.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
