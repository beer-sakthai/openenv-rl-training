name: MCP-Bench
on:
  workflow_dispatch:

jobs:
  mcp-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - run: |
          git clone https://github.com/huggingface/mcp-bench.git
          cd mcp-bench/mcp_servers && bash install.sh
      - run: |
          hf jobs uv run --flavor h200 --timeout 3h \
            -e MCP_BENCH_DIR=./mcp-bench \
            -e HUGGINGFACE_BASE_URL=http://localhost:8000/v1 \
            --secrets HF_TOKEN \
            sakthai-sft-training/eval-mcp.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
