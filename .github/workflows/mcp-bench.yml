name: MCP-Bench
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git clone https://github.com/huggingface/mcp-bench.git
          cd mcp-bench/mcp_servers && bash install.sh
      - run: |
          hf jobs uv run --flavor h200 --timeout 3h \
            -e MCP_BENCH_DIR=./mcp-bench \
            -e HUGGINGFACE_BASE_URL=http://localhost:8000/v1 \
            --secrets HF_TOKEN \
            sakthai-sft-training/eval-mcp.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
