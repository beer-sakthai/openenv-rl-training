name: MCP-Bench
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          git clone https://github.com/huggingface/mcp-bench.git
          cd mcp-bench/mcp_servers && bash install.sh
      - run: |
          hf jobs uv run --flavor h200 --timeout 3h \
            -e MCP_BENCH_DIR=./mcp-bench \
            -e HUGGINGFACE_BASE_URL=http://localhost:8000/v1 \
            --secrets HF_TOKEN \
            sakthai-sft-training/eval-mcp.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
