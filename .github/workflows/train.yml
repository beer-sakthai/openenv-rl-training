# Dispatches 1.5B SFT training to HF Jobs. Manual only: HF Jobs is paid, so
# this never fires on a push.
#
# It previously declared `runs-on: hf-jobs-h200` — not a runner label this
# repository has, so every run queued until it timed out — and then called
# `uv run` without installing uv or Python. Neither problem could surface
# while the job never started. It now matches the shape of the other HF Jobs
# workflows (lighteval.yml, eval.yml): an ubuntu runner authenticates and
# submits the job with `hf jobs uv run`, which is also what CLAUDE.md
# describes this workflow as doing.
#
# Auto-fire disabled by default (2026-08-21 consolidation). To restore
# push-on-merge, re-add:
#   push:
#     branches: [main]
#     paths: [sakthai-sft-training/train-sakthai-1.5b-v2.py]
name: Train Plus 1.5B
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # submission only; the job itself runs on HF.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub

      - name: Authenticate Hugging Face CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN repository secret is not configured or is unavailable to this workflow."
            exit 1
          fi
          hf auth login --token "$HF_TOKEN"

      - name: Submit training job
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          .github/scripts/hf-jobs-submit.sh \
            hf jobs uv run --flavor h200 --timeout 1h \
              --secrets HF_TOKEN \
              sakthai-sft-training/train-sakthai-1.5b-v2.py
