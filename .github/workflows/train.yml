name: Train Plus 1.5B
on:
  workflow_dispatch:
  # Auto-fire disabled by default (2026-08-21 consolidation): HF Jobs is paid,
  # so this workflow runs on demand only. To restore push-on-merge, re-add:
  # push:
  #   branches: [main]
  #   paths: [sakthai-sft-training/train-sakthai-1.5b-v2.py]

permissions:
  contents: read

jobs:
  train:
    runs-on: hf-jobs-h200
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - run: uv run python sakthai-sft-training/train-sakthai-1.5b-v2.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
