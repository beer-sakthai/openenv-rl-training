name: Train Plus 1.5B
on:
  workflow_dispatch:
  # Auto-fire disabled by default (2026-08-21 consolidation): HF Jobs is paid,
  # so this workflow runs on demand only. To restore push-on-merge, re-add:
  # push:
  #   branches: [main]
  #   paths: [sakthai-sft-training/train-sakthai-1.5b-v2.py]

permissions:
  contents: read

jobs:
  train:
    runs-on: hf-jobs-h200
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uv run python sakthai-sft-training/train-sakthai-1.5b-v2.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
