name: CI (with caches)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Hugging Face caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/huggingface/datasets
            ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: |
          pip install -r openenv-custom-training/requirements.txt -r openenv-multi-catalog-training/requirements.txt pytest httpx datasets

      - name: Run contract check
        run: PYTHONPATH=openenv-custom-training:openenv-multi-catalog-training python verify_grpo_contract.py

      - name: Run browsergym contract tests
        run: PYTHONPATH=openenv-custom-training:openenv-multi-catalog-training pytest -q test_browsergym_contract.py

      - name: Run agent tools tests
        run: PYTHONPATH=openenv-custom-training:openenv-multi-catalog-training pytest -q openenv-custom-training/tests/

      - name: Run a2a agent smoke tests
        run: PYTHONPATH=openenv-custom-training:openenv-multi-catalog-training pytest -q openenv-multi-catalog-training/a2a_agent/
