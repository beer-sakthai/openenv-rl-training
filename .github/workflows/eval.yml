name: Weekly Eval
on:
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - run: pip install huggingface_hub
      - name: Authenticate Hugging Face CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN repository secret is not configured or is unavailable to this workflow."
            exit 1
          fi
          hf auth login --token "$HF_TOKEN" --add-to-git false

      - run: |
          hf jobs uv run --flavor h200 --timeout 30m \
            -e SAK_MODELS=Nanthasit/sakthai-plus-1.5b \
            -e SAK_BENCH=Nanthasit/sakthai-bench-v2 \
            --secrets HF_TOKEN \
            https://huggingface.co/datasets/Nanthasit/sakthai-bench-v2/resolve/main/eval_bench.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
