name: Weekly Eval
on:
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - run: pip install huggingface_hub
      - run: |
          hf jobs uv run --flavor h200 --timeout 30m \
            -e SAK_MODELS=Nanthasit/sakthai-plus-1.5b \
            -e SAK_BENCH=Nanthasit/sakthai-bench-v2 \
            --secrets HF_TOKEN \
            https://huggingface.co/datasets/Nanthasit/sakthai-bench-v2/resolve/main/eval_bench.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
