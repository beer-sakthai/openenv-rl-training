name: Lighteval
on:
  workflow_dispatch:
  schedule: [{cron: "0 6 * * 1"}]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install lighteval torch transformers accelerate datasets
      - run: |
          hf jobs uv run --flavor h200 --timeout 1h \
            -e TASKS=mmlu:0,gsm8k:0,hellaswag:0,winogrande:0 \
            --secrets HF_TOKEN \
            sakthai-sft-training/eval-light.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
