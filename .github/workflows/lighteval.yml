name: Lighteval
on:
  workflow_dispatch:
  schedule: [{cron: "0 6 * * 1"}]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pip install lighteval torch transformers accelerate datasets
      - run: |
          hf jobs uv run --flavor h200 --timeout 1h \
            -e TASKS=mmlu:0,gsm8k:0,hellaswag:0,winogrande:0 \
            --secrets HF_TOKEN \
            sakthai-sft-training/eval-light.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
