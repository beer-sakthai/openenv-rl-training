name: Lighteval
on:
  workflow_dispatch:
  schedule: [{cron: "0 6 * * 1"}]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub
      - name: Authenticate Hugging Face CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN repository secret is not configured or is unavailable to this workflow."
            exit 1
          fi
          hf auth login --token "$HF_TOKEN"

      - run: |
          .github/scripts/hf-jobs-submit.sh \
            hf jobs uv run --flavor h200 --timeout 1h \
              -e TASKS=mmlu:0,gsm8k:0,hellaswag:0,winogrande:0 \
              --secrets HF_TOKEN \
              sakthai-sft-training/eval-light.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
